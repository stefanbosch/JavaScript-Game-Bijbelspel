<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bijbel Boeken Spel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-content">
        <div id="game-ui" style="display:none;">
            <div class="header-section text-center">
                <div class="container">
                    <h1 class="h2 mb-1">Bijbel Boeken Spel</h1>
                    <div class="fs-5 text-muted mb-3" id="game-mode-label"></div>
                    
                    <!-- Gouden Tip Knop en Paneel -->
                    <div class="mb-2">
                        <button type="button" class="btn btn-golden-tip shadow-sm" onclick="toggleGoldenTip()">
                            <i class="bi bi-info-circle me-1"></i> Geef mij een hint
                        </button>
                    </div>
                    <div id="golden-tip-box" class="golden-tip-box d-none">
                        <strong><i class="bi bi-lightbulb text-warning me-1"></i> Hint voor volgende boek:</strong>
                        <div id="golden-tip-text" class="mt-1"></div>
                    </div>

                    <!-- Zoekbalk -->
                    <div class="search-container">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="book-search" class="form-control search-input" placeholder="Zoek een bijbelboek..." autocomplete="off">
                        <div id="search-suggestions" class="search-suggestions"></div>
                    </div>

                    <div class="d-flex justify-content-center align-items-center gap-4">
                        <button class="btn btn-outline-primary" onclick="showSelection()">
                            <i class="bi bi-arrow-left"></i> Menu
                        </button>
                        <div class="fs-5 position-relative">Score: <span id="error-count" class="badge bg-danger">0</span> <span id="correct-count" class="badge bg-success">0</span></div>
                        <div id="last-correct-book"></div>
                    </div>
                </div>
            </div>

            <div class="container">
                <div id="canvas"></div>
            </div>
        </div>

        <div id="selection-screen" class="container">
            <div class="mode-selection text-center">
                <i class="bi bi-book-half display-1 text-primary mb-4"></i>
                <h2 class="mb-4">Kies een spelmodus</h2>
                <div class="d-grid gap-3">
                    <button class="btn btn-primary btn-lg" onclick="startGame('OT')">Oude Testament (39 boeken)</button>
                    <button class="btn btn-success btn-lg" onclick="startGame('NT')">Nieuwe Testament (27 boeken)</button>
                    <button class="btn btn-dark btn-lg" onclick="startGame('ALL')">Hele Bijbel (66 boeken)</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p class="mb-1">&copy; <span id="current-year"></span> - Gemaakt door Stefan Bosch</p>
            <p class="mb-0">
                <a href="https://github.com/stefanbosch/JavaScript-Game-Bijbelspel" target="_blank" rel="noopener noreferrer" class="text-decoration-none text-muted">
                    <i class="bi bi-github me-1"></i>Bekijk op GitHub
                </a>
            </p>
            <span class="soli-deo">Om God te eren in al Zijn glorie <small>(HSV, 1 Korintiërs 10:31)</small></span>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Add the script tag to import app.js -->
    <script src="app.js"></script>
    <!-- Add the script tag to import data.js -->
    <script src="data.js"></script>

</body>
</html>
